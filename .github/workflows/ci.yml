name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v5

      - name: Setup | Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Format | Terraform
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize | Terraform
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate | Terraform
        run: terraform -chdir=terraform validate

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v5

      - name: Setup | Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Install | Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check | Web
        run: pnpm check

      - name: Build | Profile sites
        run: |
          for site in $(jq -r 'keys[]' profiles.json); do
            HOMEPAGE_SITE="$site" pnpm build
          done
