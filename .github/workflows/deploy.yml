name: Deploy Website

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment target (dev, stg, or prod).
        required: true
        type: string
      ref:
        description: Immutable git reference to build and deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-website-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.terraform.outputs.targets }}
      website_url: ${{ steps.terraform.outputs.website_url }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Configure | AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Setup | Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Provision | Infrastructure
        id: terraform
        working-directory: terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -reconfigure \
            -backend-config="backend-configs/${{ inputs.environment }}.hcl"
          terraform apply -input=false -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars"
          targets=$(terraform output -json deployment_targets | jq -c '[to_entries[] | {site: .key} + .value]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "website_url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: provision
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.provision.outputs.targets) }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup | Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Setup | Ruby and blog dependencies
        if: matrix.has_blog
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: blogs

      - name: Install | Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure | AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Configure | Deployment bucket
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET_NAME=homepage-${account_id}-${DEPLOYMENT_ENVIRONMENT}" >> "$GITHUB_ENV"

      - name: Build | Website
        env:
          HOMEPAGE_SITE: ${{ matrix.site }}
          HOMEPAGE_URL: ${{ matrix.website_url }}
        run: pnpm build

      - name: Upload | Website
        run: |
          aws s3 sync dist "s3://${BUCKET_NAME}/${{ matrix.key_prefix }}" \
            --delete \
            --exclude index.html \
            --cache-control 'public, max-age=0, must-revalidate, s-maxage=86400' \
            --only-show-errors
          aws s3 cp dist/index.html \
            "s3://${BUCKET_NAME}/${{ matrix.key_prefix }}/index.html" \
            --cache-control 'no-cache, no-store, must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors

      - name: Invalidate | CloudFront cache
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id '${{ matrix.distribution_id }}' \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text \
            --no-cli-pager)
          aws cloudfront wait invalidation-completed \
            --distribution-id '${{ matrix.distribution_id }}' \
            --id "$invalidation_id"

      - name: Verify | CloudFront origin
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "https://${{ matrix.distribution_domain_name }}/" \
              | grep -F 'data-site="${{ matrix.site }}"'

      - name: Verify | Blog
        if: matrix.has_blog
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "https://${{ matrix.distribution_domain_name }}${{ matrix.blog_base_path }}/" \
            | grep -F 'href="${{ matrix.blog_base_path }}/assets/main.css"'

  deployment:
    name: Complete ${{ inputs.environment }} deployment
    needs: [provision, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ needs.provision.outputs.website_url }}
    steps:
      - name: Verify | Deployment matrix
        env:
          PROVISION_RESULT: ${{ needs.provision.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ "$PROVISION_RESULT" != "success" || "$DEPLOY_RESULT" != "success" ]]; then
            echo "::error::Deployment failed (provision: $PROVISION_RESULT, matrix: $DEPLOY_RESULT)."
            exit 1
          fi
