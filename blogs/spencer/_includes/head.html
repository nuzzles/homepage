<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3EEDF" />
    {%- seo -%}
    <meta
        name="keywords"
        content="{{ site.keywords | join: ', ' }}{% if page.categories %}, {{ page.categories | join: ', ' }}{% endif %}"
    />
    <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}" />
    <link rel="preload" href="/fonts/barlow-condensed-900.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ site.blog_theme_stylesheet | default: '/blog-theme.css' | escape }}" />
    {% for stylesheet in page.stylesheets %} {% if site.blog_stylesheets[stylesheet] %}
    <link rel="stylesheet" href="{{ site.blog_stylesheets[stylesheet] | escape }}" />
    {% else %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url | escape }}" />
    {% endif %} {% endfor %}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    {%- feed_meta -%}
</head>
