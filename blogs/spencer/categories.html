---
layout: page
title: Categories
---

<div class="category-list">
    {% for category in site.categories %}
    <section class="category-group">
        <h2>{{ category[0] }}</h2>
        <ul>
            {% for post in category[1] %}
            <li>
                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
                <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
            </li>
            {% endfor %}
        </ul>
    </section>
    {% endfor %}
</div>
