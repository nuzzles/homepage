<footer class="site-footer blog-footer">
    <div class="wrapper">
        <div class="blog-footer-identity">
            <a class="site-title" href="{{ site.Params.homepageURL }}">{{ partial "wordmark.html" . }}</a>
            <p>{{ site.Params.role }}</p>
            <p>© {{ now.Year }} {{ site.Params.fullName }}</p>
            <p class="blog-credit">Made with <svg role="img" aria-label="coffee" viewBox="0 0 24 24"><path d="M10 2v2M14 2v2M6 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" /></svg> and <img src="/images/claude-pixel.svg" alt="Claude" /></p>
        </div>
        <nav aria-label="Footer navigation">
            <a href="{{ site.Home.RelPermalink }}">Blog</a>
            <a href="{{ site.Params.aboutURL }}">About</a>
            <a href="{{ "categories.html" | relURL }}">Categories</a>
            <a href="{{ "feed.xml" | relURL }}">RSS</a>
        </nav>
        <nav aria-label="Find me online">{{ range site.Params.socials }}<a href="{{ .href }}" target="_blank" rel="noopener noreferrer">{{ .label }} ↗</a>{{ end }}</nav>
    </div>
</footer>
