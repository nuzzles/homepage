<header class="site-header" role="banner">
    <div class="wrapper">
        <div class="site-brand">
            <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.profile_name | escape }}</a>
            <span class="site-label">Blog</span>
        </div>
        <nav class="site-nav" aria-label="Blog navigation">
            <a class="page-link" href="{{ site.homepage_url }}">Homepage</a>
            {%- for path in site.header_pages -%} {%- assign nav_page = site.pages | where: "path", path | first -%} {%-
            if nav_page.title -%}
            <a class="page-link" href="{{ nav_page.url | relative_url }}">{{ nav_page.title | escape }}</a>
            {%- endif -%} {%- endfor -%}
        </nav>
    </div>
</header>
